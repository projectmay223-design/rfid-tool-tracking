name: Cleanup Staging on PR Close

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  cleanup:
    name: Remove staging comment
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Update PR comment on close
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '<!-- rfid-staging-deploy -->';
            const existing = comments.find(c => c.body.includes(marker));

            if (!existing) return;

            const wasMerged = context.payload.pull_request.merged;
            const action = wasMerged ? 'Merged to production' : 'PR closed — staging removed';

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: `${marker}
            ## Staging Deployment

            | | |
            |---|---|
            | **Status** | ${action} |
            | **Branch** | \`${{ github.head_ref }}\` |

            > ${wasMerged ? 'This PR was merged. Production deployment triggered automatically.' : 'This PR was closed without merging. Staging environment removed.'}`,
            });
