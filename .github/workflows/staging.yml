name: Staging Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build frontend
        run: NODE_ENV=production pnpm --filter @workspace/rfid-tracker run build

      - name: Build backend
        run: pnpm --filter @workspace/api-server run build

      - name: Post "Deploying..." comment on PR
        uses: actions/github-script@v7
        id: post-comment
        with:
          script: |
            const marker = '<!-- rfid-staging-deploy -->';
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const branch = context.payload.pull_request.head.ref;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            const body = [
              marker,
              '## Staging Deployment',
              '',
              '| | |',
              '|---|---|',
              `| **Status** | Deploying... |`,
              `| **Commit** | \`${sha}\` |`,
              `| **Branch** | \`${branch}\` |`,
            ].join('\n');

            let commentId;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              commentId = existing.id;
            } else {
              const { data } = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              commentId = data.id;
            }
            return commentId;

      - name: Deploy to Railway staging
        id: railway-deploy
        uses: railwayapp/railway-github-action@v1
        with:
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          environment: staging

      - name: Update PR comment — success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const commentId = ${{ steps.post-comment.outputs.result }};
            const marker = '<!-- rfid-staging-deploy -->';
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const branch = context.payload.pull_request.head.ref;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              '## Staging Deployment',
              '',
              '| | |',
              '|---|---|',
              `| **Status** | Deployed |`,
              `| **Commit** | \`${sha}\` |`,
              `| **Branch** | \`${branch}\` |`,
              `| **Build Logs** | [View](${runUrl}) |`,
              '',
              '> Staging environment is live. Changes reflect the latest push to this PR.',
              '> Status updates automatically on every new commit.',
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body,
            });

      - name: Update PR comment — failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const commentId = ${{ steps.post-comment.outputs.result }};
            const marker = '<!-- rfid-staging-deploy -->';
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const branch = context.payload.pull_request.head.ref;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              '## Staging Deployment',
              '',
              '| | |',
              '|---|---|',
              `| **Status** | Failed |`,
              `| **Commit** | \`${sha}\` |`,
              `| **Branch** | \`${branch}\` |`,
              `| **Build Logs** | [View logs](${runUrl}) |`,
              '',
              '> Deployment failed. Check the logs above to see what went wrong.',
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body,
            });
